name: Application checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: application-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: pnpm check
      - run: pnpm --filter @smartsite/mobile check:dependencies
      - name: Build and start local containers
        run: docker compose -f infra/compose.yaml up -d --build --wait --wait-timeout 120
      - name: Check real database readiness and Web
        run: |
          curl --fail --max-time 10 http://localhost:3000/api/v1/health/ready
          curl --fail --max-time 10 http://localhost:5173/healthz
      - name: Show container status
        if: always()
        run: docker compose -f infra/compose.yaml ps -a
      - name: Stop local containers
        if: always()
        run: docker compose -f infra/compose.yaml down
