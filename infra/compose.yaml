name: smartsite-local

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: smartsite
      POSTGRES_PASSWORD: smartsite_local_only
      POSTGRES_DB: smartsite
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smartsite -d smartsite']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      # Local only. Production disables interactive Swagger and uses real secrets.
      NODE_ENV: development
      PORT: '3000'
      DATABASE_URL: postgresql://smartsite:smartsite_local_only@postgres:5432/smartsite
      DATABASE_TIMEOUT_MS: '2000'
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SMARTSITE_AI_SERVICE_TOKEN: smartsite_local_dev_service_token_only
      ALERT_COOLDOWN_SECONDS: '60'
      MAX_PAST_EVENT_AGE_SECONDS: '300'
      MAX_FUTURE_CLOCK_SKEW_SECONDS: '30'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://smartsite:smartsite_local_only@postgres:5432/smartsite
      DATABASE_TIMEOUT_MS: '2000'
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - node
      - --input-type=module
      - -e
      - "import dataSource from './dist/database/typeorm.data-source.js'; await dataSource.initialize(); try { await dataSource.runMigrations(); } finally { await dataSource.destroy(); }"
    restart: 'no'

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - '127.0.0.1:5173:8080'
    depends_on:
      backend:
        condition: service_healthy

  ai:
    profiles: ['ai']
    build:
      context: ../../smartsite-ai
      dockerfile: Dockerfile
    environment:
      SMARTSITE_AI_ENVIRONMENT: development
      SMARTSITE_AI_HOST: 0.0.0.0
      SMARTSITE_AI_PORT: '8000'
      SMARTSITE_AI_BACKEND_INGESTION_URL: http://backend:3000
      SMARTSITE_AI_BACKEND_SERVICE_TOKEN: smartsite_local_dev_service_token_only
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
