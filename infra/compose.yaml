name: smartsite-local

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: smartsite
      POSTGRES_PASSWORD: smartsite_local_only
      POSTGRES_DB: smartsite
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smartsite -d smartsite']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    profiles: ['test']
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: smartsite_test
      POSTGRES_PASSWORD: smartsite_test_only
      POSTGRES_DB: smartsite_test
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smartsite_test -d smartsite_test']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      # Local only. Production disables interactive Swagger and uses real secrets.
      NODE_ENV: development
      PORT: '3000'
      DATABASE_URL: postgresql://smartsite:smartsite_local_only@postgres:5432/smartsite
      DATABASE_TIMEOUT_MS: '2000'
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # The runtime image contains production dependencies only (no pino-pretty).
      LOG_LEVEL: info
      LOG_FORMAT: json
      HTTP_RATE_LIMIT_TTL_MS: '60000'
      HTTP_RATE_LIMIT_LIMIT: '120'
      AI_RATE_LIMIT_TTL_MS: '60000'
      AI_RATE_LIMIT_LIMIT: '600'
      SMARTSITE_AI_SERVICE_TOKEN: smartsite_local_dev_service_token_only
      # Optional enrollment transport. The AI service remains fail-closed
      # until a reviewed model and private template store are configured.
      SMARTSITE_AI_IDENTITY_URL: http://ai:8000
      # Keep empty by default (deny all). Set this to the comma-separated Camera UUIDs
      # returned by `pnpm demo:setup` before recreating the Backend container.
      AI_CONFIGURATION_CAMERA_IDS: ${AI_CONFIGURATION_CAMERA_IDS:-}
      ALERT_COOLDOWN_SECONDS: '60'
      MAX_PAST_EVENT_AGE_SECONDS: '300'
      MAX_FUTURE_CLOCK_SKEW_SECONDS: '30'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://smartsite:smartsite_local_only@postgres:5432/smartsite
      DATABASE_TIMEOUT_MS: '2000'
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - node
      - --input-type=module
      - -e
      - "import dataSource from './dist/database/typeorm.data-source.js'; await dataSource.initialize(); try { await dataSource.runMigrations(); } finally { await dataSource.destroy(); }"
    restart: 'no'

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - '127.0.0.1:5173:8080'
    depends_on:
      backend:
        condition: service_healthy

  ai:
    profiles: ['ai']
    build:
      context: ../../smartsite-ai
      dockerfile: Dockerfile
    environment:
      SMARTSITE_AI_ENVIRONMENT: development
      SMARTSITE_AI_HOST: 0.0.0.0
      SMARTSITE_AI_PORT: '8000'
      SMARTSITE_AI_BACKEND_INGESTION_URL: http://backend:3000
      SMARTSITE_AI_BACKEND_SERVICE_TOKEN: smartsite_local_dev_service_token_only
      SMARTSITE_AI_IDENTITY_SERVICE_TOKEN: smartsite_local_dev_service_token_only
      # Explicit local academic-demo opt in. The public buffalo_l weights and
      # encrypted templates live only in ai-face-data, never in this repo.
      SMARTSITE_AI_IDENTITY_DEMO_MODE: ${SMARTSITE_AI_IDENTITY_DEMO_MODE:-false}
      SMARTSITE_AI_IDENTITY_MODEL_ROOT: /var/lib/smartsite-ai/model-root
      SMARTSITE_AI_IDENTITY_TEMPLATE_STORE_PATH: /var/lib/smartsite-ai/templates/face-templates.fernet
      SMARTSITE_AI_IDENTITY_TEMPLATE_ENCRYPTION_KEY: ${SMARTSITE_AI_IDENTITY_TEMPLATE_ENCRYPTION_KEY:-}
      SMARTSITE_AI_IDENTITY_MATCH_THRESHOLD: '0.45'
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ai-face-data:/var/lib/smartsite-ai

volumes:
  postgres-data:
  ai-face-data:
