packages:
  - apps/*
  - packages/*
  - contracts

allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': false
  esbuild: true
  sharp: true
minimumReleaseAge: 1440
# Expo SDK 57 compatibility patches are pinned and reviewed while the
# registry releases are still inside the one-day age window.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.28'
  - '@expo/metro-runtime@57.0.16'
  - '@expo/ui@57.0.22'
  - expo@57.0.27
  - expo-asset@57.0.19
  - expo-constants@57.0.21
  - expo-linking@57.0.12
  - expo-modules-core@57.0.21
  - expo-router@57.0.25
saveExact: true
engineStrict: true
